# Carrega os dashboards de observability/grafana/dashboards. O JSON do repositório é a fonte da verdade:
# mudanças feitas pela tela não são salvas (exporte o JSON e atualize o arquivo).
apiVersion: 1

providers:
  - name: bcb
    type: file
    allowUiUpdates: false
    disableDeletion: true
    options:
      path: /var/lib/grafana/dashboards
