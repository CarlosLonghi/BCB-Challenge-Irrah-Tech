# Alertas do perfil observability. Aparecem em Alerting e no painel "Alertas disparados" do dashboard BCB.
# Não há contact point configurado: para receber por e-mail ou Slack, crie um e aponte a política padrão para ele.
apiVersion: 1

groups:
  - orgId: 1
    name: bcb
    folder: BCB
    interval: 1m
    rules:
      - uid: bcb-backend-down
        title: 'Backend fora'
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'up{job="backend"}'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [ 1 ] }
        for: 1m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'O Prometheus não consegue coletar o backend (backend:8081)'
      - uid: bcb-postgres-down
        title: 'Postgres fora'
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'pg_up{job="postgres"}'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [ 1 ] }
        for: 1m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'O postgres-exporter não consegue conectar no banco'
      - uid: bcb-dlq
        title: 'Mensagens na DLQ'
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'bcb_queue_messages{job="backend", queue="bcb.messages.dlq"}'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [ 0 ] }
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Há mensagens na bcb.messages.dlq: falharam depois de todas as tentativas'
      - uid: bcb-urgent-slow
        title: 'Entrega URGENT lenta'
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'histogram_quantile(0.95, sum by (le) (rate(bcb_messages_delivery_seconds_bucket{job="backend", priority="URGENT"}[5m])))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [ 15 ] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'p95 da entrega de mensagens URGENT acima de 15s nos últimos 5 minutos'
      - uid: bcb-failure-rate
        title: 'Taxa de falha alta'
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: '(sum(increase(bcb_messages_failed_total{job="backend"}[10m])) or vector(0)) / sum(increase(bcb_messages_sent_total{job="backend"}[10m]))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [ 0.05 ] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Mais de 5% das mensagens enviadas nos últimos 10 minutos falharam e foram estornadas'
      - uid: bcb-http-5xx
        title: 'Erros 5xx na API'
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'sum(rate(http_server_requests_seconds_count{job="backend", status=~"5.."}[5m]))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [ 0.05 ] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'A API está respondendo 5xx (mais de 3 por minuto)'
      - uid: bcb-hikari-pending
        title: 'Pool do banco saturado'
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'max(hikaricp_connections_pending{job="backend"})'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [ 0 ] }
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Requisições esperando conexão do Hikari há mais de 2 minutos'
      - uid: bcb-rabbitmq-alarm
        title: 'Alarme no RabbitMQ'
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'max(rabbitmq_alarms_memory_used_watermark{job="rabbitmq"}) + max(rabbitmq_alarms_free_disk_space_watermark{job="rabbitmq"})'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [ 0 ] }
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'Alarme de memória ou disco no broker: publicações bloqueadas'
