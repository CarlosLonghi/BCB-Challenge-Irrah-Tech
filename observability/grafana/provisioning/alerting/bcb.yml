# Alertas do domínio (mensagens, DLQ, estorno). Os de infraestrutura (alvo fora, 5xx, Hikari, Postgres, RabbitMQ)
# estão em generic.yml. Aparecem em Alerting e no painel "Alertas disparados" do dashboard BCB.
# Sem contact point por padrão. Para receber no Discord, suba com o docker-compose.discord.yaml (ver README).
apiVersion: 1

groups:
  - orgId: 1
    name: bcb
    folder: BCB
    interval: 1m
    rules:
      - uid: bcb-dlq
        title: 'Mensagens na DLQ'
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'bcb_queue_messages{job="backend", queue="bcb.messages.dlq"}'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [ 0 ] }
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Há mensagens na bcb.messages.dlq: falharam depois de todas as tentativas'
      - uid: bcb-urgent-slow
        title: 'Entrega URGENT lenta'
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'histogram_quantile(0.95, sum by (le) (rate(bcb_messages_delivery_seconds_bucket{job="backend", priority="URGENT"}[5m])))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [ 15 ] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'p95 da entrega de mensagens URGENT acima de 15s nos últimos 5 minutos'
      - uid: bcb-failure-rate
        title: 'Taxa de falha alta'
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: '(sum(increase(bcb_messages_failed_total{job="backend"}[10m])) or vector(0)) / sum(increase(bcb_messages_sent_total{job="backend"}[10m]))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [ 0.05 ] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Mais de 5% das mensagens enviadas nos últimos 10 minutos falharam e foram estornadas'
