name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Unitarios + integracao (*IT, Testcontainers usa o Docker do runner) + cobertura minima do JaCoCo
      - name: Testes
        run: sh ./mvnw -B verify

      - name: Relatorios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Tipos gerados de openapi.json (que o OpenApiContractIT do backend confere); diferença = esqueceram de gerar
      - name: Tipos da API atualizados
        run: npm run api:types && git diff --exit-code src/shared/api/schema.d.ts

      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Aplicação inteira, como em produção local: frontend (nginx), backend, Postgres e RabbitMQ
      - name: Sobe o docker compose
        run: docker compose up -d --build --wait --wait-timeout 300

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
        env:
          CI: true

      - name: Logs dos containers
        if: failure()
        run: docker compose logs --no-color

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
