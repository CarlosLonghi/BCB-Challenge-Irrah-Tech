name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Unitarios + integracao (*IT, Testcontainers usa o Docker do runner) + cobertura minima do JaCoCo
      - name: Testes
        run: sh ./mvnw -B verify

      - name: Relatorios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Tipos gerados de openapi.json (que o OpenApiContractIT do backend confere); diferença = esqueceram de gerar
      - name: Tipos da API atualizados
        run: npm run api:types && git diff --exit-code src/shared/api/schema.d.ts

      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Config do Prometheus e provisioning do Grafana (um YAML inválido impede o Grafana de subir)
  observability:
    runs-on: ubuntu-latest
    env:
      # URL fictícia: só para o override do Discord passar na validação
      GRAFANA_DISCORD_WEBHOOK_URL: https://discord.com/api/webhooks/0/ci
      COMPOSE_FILE: docker-compose.yaml:docker-compose.discord.yaml
      COMPOSE_PROFILES: observability
    steps:
      - uses: actions/checkout@v7

      - name: Compose válido (com e sem o override do Discord)
        run: |
          docker compose -f docker-compose.yaml config -q
          docker compose config -q

      - name: Configs do Prometheus, Loki e Alloy
        run: |
          docker compose run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
          docker compose run --rm --no-deps loki -config.file=/etc/loki/loki.yml -verify-config
          docker compose run --rm --no-deps alloy fmt /etc/alloy/config.alloy > /dev/null

      - name: Grafana sobe com dashboards, datasources, alertas e contact point
        run: |
          docker compose up -d --no-deps --wait --wait-timeout 120 grafana
          api() { curl -sf -u admin:admin "http://localhost:3001$1"; }
          rules=$(api /api/v1/provisioning/alert-rules | jq length)
          echo "regras: $rules"
          test "$rules" -ge 8
          for uid in bcb spring-boot postgres rabbitmq; do
            api "/api/dashboards/uid/$uid" | jq -e --arg uid "$uid" '.dashboard.uid == $uid'
          done
          api /api/datasources/uid/loki | jq -e '.type == "loki"'
          api /api/v1/provisioning/contact-points | jq -e 'any(.[]; .uid == "bcb-discord")'

      # Ponta a ponta: um envio gera os logs "enfileirada" (requisição) e "entregue" (worker) com o traceId
      # devolvido em X-Trace-Id, e o Alloy os leva ao Loki, consultado pelo Grafana
      - name: Logs chegam ao Loki com o traceId da requisição
        run: |
          docker compose up -d --build --wait --wait-timeout 300 backend prometheus postgres-exporter loki alloy grafana
          json='Content-Type: application/json'
          curl -sf -X POST localhost:8080/clients -H "$json" -d '{"name":"CI","document":"52998224725","password":"senha-ci-123","documentType":"CPF","planType":"PRE_PAID","balance":5,"limit":0,"active":true}' > /dev/null
          token=$(curl -sf -X POST localhost:8080/auth -H "$json" -d '{"document":"52998224725","password":"senha-ci-123"}' | jq -r .token)
          trace=$(curl -sf -D - -o /dev/null -X POST localhost:8080/messages -H "$json" -H "Authorization: Bearer $token" \
            -d '{"recipientId":1,"recipientName":"CI","content":"oi","priority":"URGENT"}' | tr -d '\r' | awk -F': ' 'tolower($1)=="x-trace-id"{print $2}')
          echo "traceId: $trace"
          test -n "$trace"
          for i in $(seq 1 30); do
            lines=$(curl -sf -u admin:admin -G http://localhost:3001/api/datasources/proxy/uid/loki/loki/api/v1/query_range \
              --data-urlencode "query={service=\"backend\"} |= \"$trace\"" | jq '[.data.result[].values[]] | length')
            echo "linhas com o traceId: $lines"
            [ "${lines:-0}" -ge 1 ] && exit 0
            sleep 5
          done
          exit 1

      - name: Logs do Grafana, Loki e Alloy
        if: failure()
        run: docker compose logs --no-color grafana loki alloy

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Aplicação inteira, como em produção local: frontend (nginx), backend, Postgres e RabbitMQ
      - name: Sobe o docker compose
        run: docker compose up -d --build --wait --wait-timeout 300

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
        env:
          CI: true

      - name: Logs dos containers
        if: failure()
        run: docker compose logs --no-color

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
