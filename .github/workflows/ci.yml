name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Unitarios + integracao (*IT, Testcontainers usa o Docker do runner) + cobertura minima do JaCoCo
      - name: Testes
        run: sh ./mvnw -B verify

      - name: Relatorios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Tipos gerados de openapi.json (que o OpenApiContractIT do backend confere); diferença = esqueceram de gerar
      - name: Tipos da API atualizados
        run: npm run api:types && git diff --exit-code src/shared/api/schema.d.ts

      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Config do Prometheus e provisioning do Grafana (um YAML inválido impede o Grafana de subir)
  observability:
    runs-on: ubuntu-latest
    env:
      # URL fictícia: só para o override do Discord passar na validação
      GRAFANA_DISCORD_WEBHOOK_URL: https://discord.com/api/webhooks/0/ci
      COMPOSE_FILE: docker-compose.yaml:docker-compose.discord.yaml
      COMPOSE_PROFILES: observability
    steps:
      - uses: actions/checkout@v7

      - name: Compose válido (com e sem o override do Discord)
        run: |
          docker compose -f docker-compose.yaml config -q
          docker compose config -q

      - name: promtool check config
        run: docker compose run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml

      - name: Grafana sobe com dashboard, alertas e contact point
        run: |
          docker compose up -d --no-deps --wait --wait-timeout 120 grafana
          api() { curl -sf -u admin:admin "http://localhost:3001$1"; }
          rules=$(api /api/v1/provisioning/alert-rules | jq length)
          echo "regras: $rules"
          test "$rules" -ge 8
          api /api/dashboards/uid/bcb | jq -e '.dashboard.uid == "bcb"'
          api /api/v1/provisioning/contact-points | jq -e 'any(.[]; .uid == "bcb-discord")'

      - name: Logs do Grafana
        if: failure()
        run: docker compose logs --no-color grafana

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Aplicação inteira, como em produção local: frontend (nginx), backend, Postgres e RabbitMQ
      - name: Sobe o docker compose
        run: docker compose up -d --build --wait --wait-timeout 300

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
        env:
          CI: true

      - name: Logs dos containers
        if: failure()
        run: docker compose logs --no-color

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
