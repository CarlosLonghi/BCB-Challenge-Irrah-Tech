# Atualizações semanais de dependências. Minor e patch vêm agrupadas num PR por ecossistema;
# major vem em PR próprio, para revisar com calma (ex.: Spring Boot, React).
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-patch:
        update-types: [ minor, patch ]
    ignore:
      # Os tipos acompanham o Node que roda (imagem node:24); sobem junto com ele, à mão
      - dependency-name: "@types/node"
        update-types: [ "version-update:semver-major" ]

  # Imagens base dos Dockerfiles
  - package-ecosystem: docker
    directories: [ /backend, /frontend ]
    schedule:
      interval: weekly
    ignore:
      # Só Node LTS (versões pares); a troca de major é feita à mão, junto com o @types/node
      - dependency-name: node
        update-types: [ "version-update:semver-major" ]

  # Imagens do docker-compose.yaml (Postgres, RabbitMQ, Prometheus, Grafana, postgres-exporter)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: [ "*" ]
