# Perfil dos testes de integracao (*IT). Banco e RabbitMQ vem dos containers (@ServiceConnection)

# Worker sem pausa entre as etapas, para o teste nao esperar
bcb.worker.step-delay-ms=0

# Retentativas rapidas, para a mensagem chegar logo na dead-letter queue
spring.rabbitmq.listener.simple.retry.initial-interval=100ms

spring.jpa.show-sql=false
logging.level.org.springframework.security=INFO

bcb.security.jwt.secret=segredo-dos-testes-de-integracao-0123456789

# Rotina de republicacao: os testes chamam requeueUnpublished() direto, sem esperar o agendamento
bcb.recovery.unpublished-interval=PT1H
bcb.recovery.unpublished-grace=PT0S

# Leitura simulada desligada: os ITs esperam DELIVERED; o ReadSimulatorIT chama a rotina direto
bcb.simulation.read-interval=PT1H

# Estatisticas do Hibernate: o PaginationIT conta as queries para pegar N+1
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN
