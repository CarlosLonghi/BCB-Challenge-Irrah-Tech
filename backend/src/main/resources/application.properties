spring.application.name=bcb

# Database Config
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/bcb
spring.datasource.username=postgres
spring.datasource.password=postgres

# Erros: inclui o campo "message" no corpo (o frontend mostra ao usuario)
spring.web.error.include-message=always
spring.web.error.include-stacktrace=never

# Actuator: so o health fica exposto (usado pelo healthcheck do docker-compose)
management.endpoints.web.exposure.include=health

# RabbitMQ (no docker-compose o host vem de SPRING_RABBITMQ_HOST)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Uma mensagem por vez no consumidor, para a prioridade valer entre as que estao esperando
spring.rabbitmq.listener.simple.prefetch=1
# 3 tentativas (1 + 2 retentativas); esgotadas, a mensagem vira FAILED e vai para a dead-letter queue
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Jackson 3 (Spring Boot 4) recusa campo primitivo ausente ou nulo no JSON; aqui volta ao
# comportamento do Jackson 2: ex. "active" omitido no cadastro vira false, e o @Valid valida o resto
spring.jackson.deserialization.fail-on-null-for-primitives=false

# JPA Config
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

# Flyway Config
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-on-migrate=true

# Spring Security
logging.level.org.springframework.security=DEBUG
