spring.application.name=bcb

# Sem perfil ativo (ex.: ./mvnw spring-boot:run), sobe com o application-dev.properties
spring.profiles.default=dev

# Database Config
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/bcb
spring.datasource.username=postgres
spring.datasource.password=postgres

# Erros: inclui o campo "message" no corpo (o frontend mostra ao usuario)
spring.web.error.include-message=always
spring.web.error.include-stacktrace=never

# Actuator: so o health fica exposto (usado pelo healthcheck do docker-compose)
management.endpoints.web.exposure.include=health

# RabbitMQ (no docker-compose o host vem de SPRING_RABBITMQ_HOST)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Uma mensagem por vez no consumidor, para a prioridade valer entre as que estao esperando
spring.rabbitmq.listener.simple.prefetch=1
# 3 tentativas (1 + 2 retentativas); esgotadas, a mensagem vira FAILED e vai para a dead-letter queue
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Rotina que republica mensagens QUEUED que nunca chegaram ao RabbitMQ (publicacao falhou no envio)
bcb.recovery.unpublished-interval=PT30S
bcb.recovery.unpublished-grace=PT10S

# Leitura simulada: DELIVERED vira READ depois de read-after (rotina a cada read-interval)
bcb.simulation.read-interval=PT2S
bcb.simulation.read-after=PT4S

# Jackson 3 (Spring Boot 4) recusa campo primitivo ausente ou nulo no JSON; aqui volta ao
# comportamento do Jackson 2: ex. "active" omitido no cadastro vira false, e o @Valid valida o resto
spring.jackson.deserialization.fail-on-null-for-primitives=false

# JPA Config
spring.jpa.hibernate.ddl-auto=validate
# Sem sessao aberta na view: associacao LAZY lida fora de transacao falha no teste em vez de virar query escondida
spring.jpa.open-in-view=false

# Flyway Config
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-on-migrate=true

# Sessao: JWT HS256. O segredo vem de JWT_SECRET (min. 32 bytes); sem ele a aplicacao nao sobe
bcb.security.jwt.secret=${JWT_SECRET}
bcb.security.jwt.ttl=8h

# Origens do frontend liberadas no CORS (separadas por virgula)
bcb.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# SSE (GET /events): a conexao fecha depois de timeout (o frontend reconecta); heartbeat mantem viva em proxies
bcb.events.timeout=PT30M
bcb.events.heartbeat=PT20S
