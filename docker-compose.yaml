# Credenciais e segredo vêm do .env na raiz (copie de .env.example); sem ele valem os padrões de dev abaixo.
# Banco, RabbitMQ e o painel ficam publicados só em 127.0.0.1: dá para usar do próprio computador
# (backend ou frontend rodando fora do Docker), mas ninguém da rede alcança.

services:
  db:
    image: postgres:18-alpine
    container_name: bcb-db
    restart: always
    environment:
      POSTGRES_DB: bcb
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d bcb" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: bcb-rabbitmq
    restart: always
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"   # painel de gerenciamento (usuário e senha de RABBITMQ_USER/RABBITMQ_PASSWORD)
    # 15692 (métricas do plugin rabbitmq_prometheus) fica na rede interna: o Prometheus coleta por dentro
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: bcb-app:latest
    container_name: bcb-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Só a API. O Actuator (8081: health e métricas) fica na rede interna: o healthcheck da imagem e o
    # Prometheus (perfil observability) chegam nele por dentro
    ports:
      - "8080:8080"
    environment:
      # Qualquer perfil diferente de "dev": sem SQL no log e sem DEBUG do Spring Security
      SPRING_PROFILES_ACTIVE: docker
      # Logs em JSON (formato ECS), com trace.id para seguir uma requisição até o worker
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      # Segredo do JWT (mín. 32 bytes)
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-troque-em-producao-0123456789}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bcb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}

  frontend:
    build:
      context: ./frontend
      args:
        # O navegador chama a API pelo host (não pelo nome "backend" da rede do Docker).
        VITE_API_URL: http://localhost:8080
    container_name: bcb-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"   # build estático servido por nginx sem root

  # Opcional: docker compose --profile observability up -d → Prometheus em :9090 e Grafana em :3001
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: bcb-prometheus
    profiles: [ observability ]
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres-exporter:
        condition: service_started
    # Ao trocar o command, os dois primeiros flags da imagem precisam ser repetidos
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Histórico das métricas (15 dias); some com docker compose down -v
      - prometheus_data:/prometheus

  # Métricas do Postgres para o Prometheus (porta 9187 só na rede interna). Usa o mesmo usuário do backend
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: bcb-postgres-exporter
    profiles: [ observability ]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: db:5432/bcb?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-postgres}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:-postgres}

  # Datasource, dashboard "BCB" e alertas provisionados de observability/grafana (sem volume: tudo vem dos arquivos).
  # Alertas no Discord: docker-compose.discord.yaml
  grafana:
    image: grafana/grafana:13.2.4
    container_name: bcb-grafana
    profiles: [ observability ]
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3001:3000"   # a 3000 do host é do frontend
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/bcb.json
    # Montagens separadas, sobre as pastas que a imagem já tem: o override do Discord acrescenta um arquivo em alerting/
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/provisioning/alerting/bcb.yml:/etc/grafana/provisioning/alerting/bcb.yml:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  db_data:
  prometheus_data:
