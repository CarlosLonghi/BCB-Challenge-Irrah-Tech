server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Headers de segurança. O add_header de um location substitui os do server, por isso vão nos dois.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA: rotas como /conversas/7 não existem como arquivo; o React Router resolve no navegador.
    location / {
        try_files $uri /index.html;
    }

    # Arquivos de /assets têm hash no nome: podem ficar em cache por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
